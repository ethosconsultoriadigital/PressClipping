# ============================================================================
# LIVE COMPARISON — TIER CRISIS (shadow, cada 6 horas, desfasado)
# ----------------------------------------------------------------------------
# WORKFLOW ACTIVO EN MODO SOMBRA (NO producción), SEPARADO del shadow base y del
# tier nacional B.
#
# Procesa SOLO el tier crisis (UNO MAS UNO MED-0170 + El Sol de Irapuato MED-0169)
# con pipeline AISLADO por medio_id. El crawl es POR MEDIO con su fuente_preferida:
# MED-0170 usa sitemap (el RSS pierde las notas de crisis antes de crawlear),
# MED-0169 usa RSS (red OEM público; no tiene sitemap propio). Por código
# (run-shadow-crisis-tier.ts) impide: export-results · generate-xml · classify-ia ·
# WhatsApp/correos · export-raw-news. NO toca 01_Noticias_Raw / 02_Menciones / 04_Logs.
#
# NO incluye El Otro Enfoque (MED-0171) todavía.
#
# INTEGRA shadow-alerts en MODO OBSERVACIÓN (--run-shadow-alerts): tras el
# comparativo evalúa reglas P1/P2/P3 con allowlist CLI-0002 y ESCRIBE en
# 10_Alertas_Sombra. NUNCA envía: guardas duras (--no-send/--no-whatsapp/
# --no-email + verificación de env) abortan ante cualquier intento de envío.
# NO cambia clientes.alertas_activas.
#
# CONCURRENCY: comparte grupo con el shadow base y el nacional B
# (`live-comparison-shadow`) para que NUNCA dos workflows escriban 05/07 al mismo
# tiempo. cancel-in-progress=false → si otro está corriendo, este se ENCOLA. El
# cron va al minuto ':15' cada 6h para desfasarse del base (':00' cada 2h) y del
# nacional B (':30' cada 6h).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY · GOOGLE_SERVICE_ACCOUNT_EMAIL ·
#   GOOGLE_PRIVATE_KEY · GOOGLE_OUTPUT_SHEET_ID (fallback GOOGLE_SHEET_ID)
# ============================================================================
name: live-comparison-shadow-crisis

on:
  schedule:
    - cron: '15 */6 * * *'   # cada 6 horas, al minuto 15 (desfasado del base y del nacional B)
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Tamaño de la ventana móvil en horas.'
        required: false
        default: '48'

concurrency:
  group: live-comparison-shadow   # MISMO grupo que el shadow base y nacional B → lock compartido de 05/07
  cancel-in-progress: false

jobs:
  run:
    name: Shadow crisis tier (UNO MAS UNO sitemap + El Sol de Irapuato RSS, aislado por medio)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_OUTPUT_SHEET_ID: ${{ secrets.GOOGLE_OUTPUT_SHEET_ID }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      LOG_FORMAT: json
      RUN_BY: github-actions-shadow-crisis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # Node 20: OAuth de Google Sheets funciona; Supabase usa el polyfill ws
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Shadow crisis tier (ventana móvil 48h, sitemap, observación shadow-alerts, sin envíos)
        # Node 20: inyecta WebSocket global (ws) para Supabase; IPv4 por runners sin IPv6.
        # NOTA: NO usar --no-alerts aquí; impediría/confundiría la observación shadow-alerts.
        # El no-envío se garantiza con --no-send --no-whatsapp --no-email + guardas de código.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
        run: |
          WINDOW="${{ github.event.inputs.window_hours || '48' }}"
          npm run shadow-crisis-tier -- \
            --window-hours=$WINDOW \
            --output=sheet \
            --append-metrics-history \
            --no-export-results \
            --no-generate-xml \
            --run-shadow-alerts \
            --shadow-client-allowlist=CLI-0002 \
            --shadow-alerts-output=sheet \
            --no-send \
            --no-whatsapp \
            --no-email
