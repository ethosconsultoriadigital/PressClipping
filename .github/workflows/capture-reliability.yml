name: capture-reliability

# GitHub is one caller of the same CLI. Persistent DB/store is the source of truth.
#
# WRITE GATES (fail-closed):
#   ALLOW_CAPTURE_RECOVERY_WRITES        — único permiso para schedules y para
#                                          dispatch sin límites (catálogo completo).
#   ALLOW_CAPTURE_RECOVERY_CANARY_WRITES — solo workflow_dispatch CON hashes
#                                          explícitos (recovery_hashes|urls).
#   medio_ids solo NO autoriza writes ni un claim sin p_only_hashes.
# Un canary no activa el recovery abierto. Schedule ignora el secreto canario.
# Dispatch limitado NUNCA adelanta caprel-cursor-24h/72h.
#
# EXECUTION PATH: GitHub no registra ni permite workflow_dispatch de este
# archivo hasta que exista en la rama default. No usar dispatch desde RC1
# antes de esa integración. Camino seguro post-hotfix (no ejecutar ahora):
#   1) CLI local RC1 con override efímero + hashes exactos, o
#   2) integración autorizada a default y después dispatch con hashes.
#
# CATCH-UP: resolve-cycle lee el cursor durable (último WINDOW_END seguro) y
# congela UN ciclo para scheduler + 8 shards + recovery. No calcula «ahora-24h».
# Si el scheduler/resolve falla, los workers no arrancan (sin outputs vacíos).
# Si un shard falla: recovery corre el ciclo congelado sobre trabajo ya
# identificado y declara COVERAGE_COMPLETE=false.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 24h | 72h | auditor
        required: false
        default: '24h'
      dry_run:
        description: Sin writes de recovery (default true)
        required: false
        default: 'true'
      role:
        description: resolve-cycle | scheduler | source | recovery | all
        required: false
        default: 'all'
      cycle_id:
        description: Fixed cycle id (optional; ignored on schedule catch-up)
        required: false
        default: ''
      window_start:
        description: ISO window start (dispatch only; schedule uses durable cursor)
        required: false
        default: ''
      window_end:
        description: ISO window end (dispatch only; schedule uses durable cursor)
        required: false
        default: ''
      medio_ids:
        description: Canario — lista de medio_id. Vacío en schedule = catálogo completo (requiere gate full).
        required: false
        default: ''
      shard_index:
        description: Shard index (0-based)
        required: false
        default: '0'
      shard_count:
        description: Shard count
        required: false
        default: '8'
      max_sources_this_run:
        description: Max sources this source-worker run
        required: false
        default: '80'
      recovery_batch_size:
        description: Recovery claim batch size
        required: false
        default: '50'
      max_recovery_batches:
        description: Recovery batches this run
        required: false
        default: '20'
      recovery_hashes:
        description: Canario — hashes. Vacío en schedule.
        required: false
        default: ''
      recovery_urls:
        description: Canario — URLs. Vacío en schedule.
        required: false
        default: ''
  schedule:
    - cron: '25 * * * *'
    - cron: '50 11 * * *'

concurrency:
  group: capture-reliability
  cancel-in-progress: false

jobs:
  scheduler:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.role == 'scheduler' || github.event.inputs.role == 'resolve-cycle' || github.event.inputs.role == 'all' || github.event.inputs.role == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOW_CAPTURE_RECOVERY_WRITES: ${{ secrets.ALLOW_CAPTURE_RECOVERY_WRITES }}
      ALLOW_CAPTURE_RECOVERY_CANARY_WRITES: ${{ secrets.ALLOW_CAPTURE_RECOVERY_CANARY_WRITES }}
      CAPTURE_CATCH_UP_FROM: ${{ secrets.CAPTURE_CATCH_UP_FROM }}
      RUN_BY: github-actions-capture-reliability
      LOG_FORMAT: json
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'
    outputs:
      skip: ${{ steps.cycle.outputs.skip }}
      cycle_id: ${{ steps.cycle.outputs.cycle_id }}
      window_start: ${{ steps.cycle.outputs.window_start }}
      window_end: ${{ steps.cycle.outputs.window_end }}
      mode: ${{ steps.cycle.outputs.mode }}
      reason: ${{ steps.cycle.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - id: cycle
        name: Resolve durable catch-up cycle
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || '24h' }}"
          if [ "${{ github.event.schedule }}" = "50 11 * * *" ]; then MODE=72h; fi
          EVENT="${{ github.event_name }}"
          ARGS="--role=resolve-cycle --mode=$MODE --event=$EVENT --shard-count=${{ github.event.inputs.shard_count || '8' }} --store=artifacts/capture-reliability-store.json --gap-candidates=config/capture-gap-candidates.json"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.window_start }}" ] && [ -n "${{ github.event.inputs.window_end }}" ]; then
            ARGS="$ARGS --window-start=${{ github.event.inputs.window_start }} --window-end=${{ github.event.inputs.window_end }}"
            if [ -n "${{ github.event.inputs.cycle_id }}" ]; then ARGS="$ARGS --cycle-id=${{ github.event.inputs.cycle_id }}"; fi
          fi
          npm run capture-reliability:reconcile -- $ARGS
          test -f artifacts/capture-reliability-cycle.json
          SKIP=$(node -e "const j=require('./artifacts/capture-reliability-cycle.json'); process.stdout.write(j.skip||'false')")
          WS=$(node -e "const j=require('./artifacts/capture-reliability-cycle.json'); process.stdout.write(j.window_start||'')")
          WE=$(node -e "const j=require('./artifacts/capture-reliability-cycle.json'); process.stdout.write(j.window_end||'')")
          CID=$(node -e "const j=require('./artifacts/capture-reliability-cycle.json'); process.stdout.write(j.cycle_id||'')")
          REASON=$(node -e "const j=require('./artifacts/capture-reliability-cycle.json'); process.stdout.write(j.reason||'')")
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "window_start=$WS" >> "$GITHUB_OUTPUT"
          echo "window_end=$WE" >> "$GITHUB_OUTPUT"
          echo "cycle_id=$CID" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" != "true" ] && { [ -z "$WE" ] || [ -z "$WS" ] || [ -z "$CID" ]; }; then
            echo "FAIL_CLOSED empty frozen cycle" >&2
            exit 1
          fi
      - name: Schedule source jobs for frozen window
        if: ${{ steps.cycle.outputs.skip != 'true' && steps.cycle.outputs.window_end != '' }}
        run: |
          set -euo pipefail
          ARGS="--role=scheduler --event=${{ github.event_name }} --mode=${{ steps.cycle.outputs.mode }} --cycle-id=${{ steps.cycle.outputs.cycle_id }} --window-start=${{ steps.cycle.outputs.window_start }} --window-end=${{ steps.cycle.outputs.window_end }} --shard-count=${{ github.event.inputs.shard_count || '8' }} --store=artifacts/capture-reliability-store.json --gap-candidates=config/capture-gap-candidates.json"
          HASH_SCOPED=false
          if [ -n "${{ github.event.inputs.medio_ids }}" ]; then ARGS="$ARGS --medio-ids=${{ github.event.inputs.medio_ids }}"; fi
          if [ "${ALLOW_CAPTURE_RECOVERY_WRITES}" = "true" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; }; then
            ARGS="$ARGS --no-dry-run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$HASH_SCOPED" = "true" ] && [ "${ALLOW_CAPTURE_RECOVERY_CANARY_WRITES}" = "true" ] && [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="$ARGS --no-dry-run"
          fi
          npm run capture-reliability:reconcile -- $ARGS

  source-worker:
    needs: scheduler
    if: ${{ needs.scheduler.result == 'success' && needs.scheduler.outputs.skip != 'true' && needs.scheduler.outputs.window_end != '' && (github.event_name == 'schedule' || github.event.inputs.role == 'source' || github.event.inputs.role == 'all' || github.event.inputs.role == '') }}
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOW_CAPTURE_RECOVERY_WRITES: ${{ secrets.ALLOW_CAPTURE_RECOVERY_WRITES }}
      ALLOW_CAPTURE_RECOVERY_CANARY_WRITES: ${{ secrets.ALLOW_CAPTURE_RECOVERY_CANARY_WRITES }}
      RUN_BY: github-actions-capture-source
      LOG_FORMAT: json
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Source worker shard on frozen cycle
        run: |
          set -euo pipefail
          test -n "${{ needs.scheduler.outputs.window_end }}"
          test -n "${{ needs.scheduler.outputs.window_start }}"
          test -n "${{ needs.scheduler.outputs.cycle_id }}"
          ARGS="--role=source --event=${{ github.event_name }} --mode=${{ needs.scheduler.outputs.mode }} --cycle-id=${{ needs.scheduler.outputs.cycle_id }} --window-start=${{ needs.scheduler.outputs.window_start }} --window-end=${{ needs.scheduler.outputs.window_end }} --shard-index=${{ matrix.shard_index }} --shard-count=8 --max-sources-this-run=${{ github.event.inputs.max_sources_this_run || '80' }} --no-recovery --store=artifacts/capture-reliability-store.json --gap-candidates=config/capture-gap-candidates.json"
          HASH_SCOPED=false
          if [ -n "${{ github.event.inputs.medio_ids }}" ]; then ARGS="$ARGS --medio-ids=${{ github.event.inputs.medio_ids }}"; fi
          if [ "${ALLOW_CAPTURE_RECOVERY_WRITES}" = "true" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; }; then
            ARGS="$ARGS --no-dry-run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$HASH_SCOPED" = "true" ] && [ "${ALLOW_CAPTURE_RECOVERY_CANARY_WRITES}" = "true" ] && [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="$ARGS --no-dry-run"
          fi
          npm run capture-reliability:reconcile -- $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-reliability-source-${{ matrix.shard_index }}
          path: artifacts
          if-no-files-found: ignore

  recovery-worker:
    needs: [scheduler, source-worker]
    if: ${{ always() && needs.scheduler.result == 'success' && needs.scheduler.outputs.skip != 'true' && needs.scheduler.outputs.window_end != '' && (github.event_name == 'schedule' || github.event.inputs.role == 'recovery' || github.event.inputs.role == 'all' || github.event.inputs.role == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOW_CAPTURE_RECOVERY_WRITES: ${{ secrets.ALLOW_CAPTURE_RECOVERY_WRITES }}
      ALLOW_CAPTURE_RECOVERY_CANARY_WRITES: ${{ secrets.ALLOW_CAPTURE_RECOVERY_CANARY_WRITES }}
      COVERAGE_COMPLETE: ${{ needs.source-worker.result == 'success' }}
      RUN_BY: github-actions-capture-recovery
      LOG_FORMAT: json
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Recovery on frozen cycle only
        run: |
          set -euo pipefail
          test -n "${{ needs.scheduler.outputs.window_end }}"
          test -n "${{ needs.scheduler.outputs.cycle_id }}"
          ARGS="--role=recovery --event=${{ github.event_name }} --mode=${{ needs.scheduler.outputs.mode }} --cycle-id=${{ needs.scheduler.outputs.cycle_id }} --window-start=${{ needs.scheduler.outputs.window_start }} --window-end=${{ needs.scheduler.outputs.window_end }} --recovery-batch-size=${{ github.event.inputs.recovery_batch_size || '50' }} --max-recovery-batches=${{ github.event.inputs.max_recovery_batches || '20' }} --recovery-concurrency=4 --global-concurrency=8 --per-host-concurrency=2 --store=artifacts/capture-reliability-store.json"
          HASH_SCOPED=false
          if [ -n "${{ github.event.inputs.recovery_hashes }}" ]; then HASH_SCOPED=true; ARGS="$ARGS --recovery-hashes=${{ github.event.inputs.recovery_hashes }}"; fi
          if [ -n "${{ github.event.inputs.recovery_urls }}" ]; then HASH_SCOPED=true; ARGS="$ARGS --recovery-urls=${{ github.event.inputs.recovery_urls }}"; fi
          if [ -n "${{ github.event.inputs.medio_ids }}" ]; then ARGS="$ARGS --medio-ids=${{ github.event.inputs.medio_ids }}"; fi
          if [ "${ALLOW_CAPTURE_RECOVERY_WRITES}" = "true" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; }; then
            ARGS="$ARGS --no-dry-run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$HASH_SCOPED" = "true" ] && [ "${ALLOW_CAPTURE_RECOVERY_CANARY_WRITES}" = "true" ] && [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="$ARGS --no-dry-run"
          fi
          echo "COVERAGE_COMPLETE=${COVERAGE_COMPLETE}"
          npm run capture-reliability:reconcile -- $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-reliability-recovery
          path: artifacts
          if-no-files-found: ignore
