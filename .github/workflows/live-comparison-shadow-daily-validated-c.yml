# ============================================================================
# LIVE COMPARISON — TIER DAILY VALIDATED SHARD C (shadow, C1, MANUAL ONLY)
# ----------------------------------------------------------------------------
# WORKFLOW ACTIVO EN MODO SOMBRA (NO producción). Mismo motor que A/B
# (`scripts/run-shadow-daily-validated-tier.ts --shard=C`). NO duplica el
# runner. Procesa los 12 medios C1 PASS, net-new respecto de base / nacional B /
# crisis / shard A / shard B. MED-0043 ZonaDocs NO entra (DUPLICATE_HOLD de
# MED-0192 en A).
#
# SIN SCHEDULE: solo workflow_dispatch hasta validar health real.
#
# CONCURRENCY: MISMO grupo `live-comparison-shadow` que base/nacional B/crisis
# y daily A/B. cancel-in-progress=false → si otro writer corre, este se ENCOLA.
#
# ENRICH DRAIN V1: ON en esta corrida manual (única vía de disparo).
#
# Por código impide: export-results · generate-xml · classify-ia · export-raw-news
# · WhatsApp/correos/Twilio/Gmail/SMTP. NO toca 02_Menciones.
# ============================================================================
name: live-comparison-shadow-daily-validated-c

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Tamaño de la ventana móvil en horas.'
        required: false
        default: '48'

concurrency:
  group: live-comparison-shadow   # MISMO grupo que base/nacional B/crisis/daily A/B
  cancel-in-progress: false

jobs:
  run:
    name: Shadow daily-validated shard C (C1, net-new, aislado por medio, sin envíos)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_OUTPUT_SHEET_ID: ${{ secrets.GOOGLE_OUTPUT_SHEET_ID }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      LOG_FORMAT: json
      RUN_BY: github-actions-shadow-daily-validated-c
      JOB_TIMEOUT_MINUTES: '25'
      ENRICH_DRAIN_V1: '1'
    steps:
      - name: Registrar inicio del job
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Shadow daily-validated shard C (ventana móvil 48h, net-new, sin envíos)
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
        run: |
          WINDOW="${{ github.event.inputs.window_hours || '48' }}"
          npm run shadow-daily-validated-tier -- \
            --shard=C \
            --window-hours=$WINDOW \
            --job-started-at="$JOB_STARTED_AT" \
            --max-notas=15 \
            --enrich-limit=500 \
            --detect-limit=500 \
            --output=sheet \
            --append-metrics-history \
            --no-export-results \
            --no-generate-xml \
            --no-send \
            --no-whatsapp \
            --no-email
