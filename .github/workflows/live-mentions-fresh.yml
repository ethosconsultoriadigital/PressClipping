# ============================================================================
# LIVE MENTIONS FRESH — canary manual (sin horario)
# ----------------------------------------------------------------------------
# 1. Recovery de contenido en medios prioritarios (enrich existente, acotado).
# 2. Body Fresh Lane global.
# 3. Title-only lane para Mery, Jumex y Patrón. No marca procesado.
# 4. Export solo 02_Menciones de esos tres clientes.
#
# NO hace crawl, alertas, email, WhatsApp, Twilio ni SMTP.
# NO escribe Sheets finales de cliente.
# NO modifica extractores ni la infraestructura de enrich.
#
# workflow_dispatch únicamente. dry_run=true por defecto.
# ============================================================================
name: live-mentions-fresh

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = no escribe noticias, menciones ni 02_Menciones'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      priority_media_ids:
        description: 'Medios prioritarios para recovery, separados por coma'
        required: false
        default: 'MED-0017'
        type: string

concurrency:
  group: live-comparison-shadow
  cancel-in-progress: false

jobs:
  live-mentions:
    name: Recovery + body lane + title-only + export
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_OUTPUT_SHEET_ID: ${{ secrets.GOOGLE_OUTPUT_SHEET_ID }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      LOG_FORMAT: json
      RUN_BY: github-actions-live-mentions-fresh
      PRIORITY_MENTION_MEDIA_IDS: ${{ inputs.priority_media_ids || 'MED-0017' }}
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'
      NO_SMTP: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Priority recovery — missing clean text
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail
          ARGS="--medio-ids=${PRIORITY_MENTION_MEDIA_IDS} --window-days=2 --recent-first --only-pending-mentions --only-missing-clean-text --limit=50"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run enrich-news -- $ARGS

      - name: Priority recovery — missing body text
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail
          ARGS="--medio-ids=${PRIORITY_MENTION_MEDIA_IDS} --window-days=2 --recent-first --only-pending-mentions --only-missing-body-text --limit=50"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run enrich-news -- $ARGS

      - name: Detect mentions (fresh body lane)
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail
          ARGS="--limit=500 --only-with-text --fresh-lane --fresh-hours=48 --fresh-share=0.70"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run detect-mentions -- $ARGS

      - name: Detect title-only (Mery, Jumex, Patrón; no marca procesado)
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail
          ARGS="--hours=48 --page-size=500 --max-scan=10000"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run detect-title-only -- $ARGS

      - name: Export 02_Menciones (ventana editorial 48h)
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail
          ARGS="--mentions-only --clients=CLI-MERY-TEST,CLI-0001,CLI-0002 --window-hours=48 --news-window-hours=48 --recent-first --limit=500"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run export-results -- $ARGS
