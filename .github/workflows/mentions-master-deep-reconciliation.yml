name: mentions-master-deep-reconciliation

# Match-only 72h self-healing. No crawl masivo. No alertas.
# Primera fase: sólo workflow_dispatch. No se activa cron hasta autorización.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'No escribe MASTER'
        required: false
        default: true
        type: boolean

concurrency:
  group: mentions-master-fast-lane
  cancel-in-progress: false

jobs:
  run:
    name: 72h match-only reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_MENTIONS_MASTER_SHEET_ID: '1T4-RLnBrK0lp3p-r23hRjrJAmI03QLzBavWM3ZpcmOA'
      GOOGLE_MENTIONS_MASTER_TAB: 'MENCIONES_MASTER'
      LOG_FORMAT: json
      RUN_BY: github-actions-mentions-deep-reconciliation
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'
      MENTIONS_MASTER_BODY_V2: 'true'
      MENTIONS_MASTER_BODY_POLICY: 'general'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Deep reconciliation match-only
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
        run: |
          ARGS=( "--match-only" "--window-days=3" "--overlap-minutes=4320" )
          if [ "${{ inputs.dry_run }}" != "false" ]; then
            ARGS+=( "--dry-run" )
          fi
          npm run mentions-master:fast-lane -- "${ARGS[@]}"
