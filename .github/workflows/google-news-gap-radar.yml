name: google-news-gap-radar

# Safety-net discovery only. No matching. No News Lake writes. No Source Registry writes.

on:
  # TEMPORARY RC1 RELEASE GATE:
  # workflow_dispatch only until controlled default-branch canary,
  # cursor seed and explicit production authorization.
  # schedule:
  #   - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Queries de este ciclo (round-robin)'
        required: false
        default: '12'
        type: string

concurrency:
  group: google-news-gap-radar
  cancel-in-progress: false

jobs:
  run:
    name: Google News gap radar (dry)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOG_FORMAT: json
      RUN_BY: github-actions-google-news-gap-radar
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'
      GOOGLE_RADAR_CURSOR_BACKEND: supabase
      ALLOW_GOOGLE_GAP_DB_WRITES: ${{ secrets.ALLOW_GOOGLE_GAP_DB_WRITES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Radar dry-run
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
          GOOGLE_RADAR_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '12' }}
        run: npm run mentions-matching:google-gap-radar -- --dry-run --batch=${GOOGLE_RADAR_BATCH}
      - name: Upload radar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-gap-radar-${{ github.run_id }}
          path: |
            artifacts/google-news-gap-radar-*.json
            artifacts/agent-a-gap-handoff-v7-*.json
            artifacts/google-query-plan-cursor.json
          if-no-files-found: warn
          retention-days: 14
