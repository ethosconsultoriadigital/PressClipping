# ============================================================================
# PATRÓN NO-PC PRODUCTION CAPTURE — SCHEDULE AUTOMÁTICO CADA 2H (2026-07-17)
# ----------------------------------------------------------------------------
# Ejecuta scripts/run-patron-no-pc-production-capture.ts: SOLO CLI-0002
# (Patrón/Bacardí/Bebidas alcohólicas). Nunca toca Jumex. Nunca envía nada
# (email/WhatsApp/Twilio/SMTP). Nunca usa classify-ia/generate-xml/export-results.
#
# `schedule` activado por autorización explícita del usuario tras validación
# manual (escritura real confirmada en NoticiasPatron, dedupe verificado,
# 1067 tests verdes). El `schedule` SIEMPRE corre real (dry_run=false,
# output_sheet=true, allow_final_sheet=true) — el pipeline interno sigue
# siendo append+dedupe en cada capa, así que una corrida sin novedades escribe
# 0 filas nuevas (no rompe nada). El `workflow_dispatch` manual CONSERVA sus
# defaults seguros (dry_run=true, output_sheet=false, allow_final_sheet=false)
# — solo el trigger `schedule` fuerza el modo real, vía guard por
# `github.event_name` en el paso de ejecución (los `github.event.inputs.*` no
# existen en eventos `schedule`).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY · GOOGLE_SERVICE_ACCOUNT_EMAIL ·
#   GOOGLE_PRIVATE_KEY · GOOGLE_OUTPUT_SHEET_ID (fallback GOOGLE_SHEET_ID)
# ============================================================================
name: patron-no-pc-capture

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas, en punto — captura real automática (ver guard event_name abajo)
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Tamaño de la ventana móvil en horas.'
        required: false
        default: '24'
      dry_run:
        description: 'Modo dry-run (true = no escribe nada, solo reporta).'
        required: false
        default: 'true'
      output_sheet:
        description: 'Escribir en Sheets (tabs propias 11/12/13/15). Ignorado si dry_run=true.'
        required: false
        default: 'false'
      allow_final_sheet:
        description: 'Escribir en la hoja EXTERNA real NoticiasPatron (requiere output_sheet=true y dry_run=false).'
        required: false
        default: 'false'
      max_rows:
        description: 'Tope de filas por paso del pipeline.'
        required: false
        default: '300'

concurrency:
  group: patron-no-pc-capture
  cancel-in-progress: false

jobs:
  run:
    name: Patrón no-PC production capture (solo CLI-0002, sin envíos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_OUTPUT_SHEET_ID: ${{ secrets.GOOGLE_OUTPUT_SHEET_ID }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      LOG_FORMAT: json
      RUN_BY: github-actions-patron-no-pc-capture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Patrón no-PC capture (solo CLI-0002, sin envíos, sin Jumex)
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # El schedule SIEMPRE corre real: dry_run/output_sheet/allow_final_sheet no
            # existen como inputs en eventos `schedule` (solo aplican a workflow_dispatch).
            WINDOW="24"
            MAXROWS="300"
            DRYRUN="false"
            OUTPUT="true"
            ALLOWFINAL="true"
          else
            WINDOW="${{ github.event.inputs.window_hours || '24' }}"
            MAXROWS="${{ github.event.inputs.max_rows || '300' }}"
            DRYRUN="${{ github.event.inputs.dry_run || 'true' }}"
            OUTPUT="${{ github.event.inputs.output_sheet || 'false' }}"
            ALLOWFINAL="${{ github.event.inputs.allow_final_sheet || 'false' }}"
          fi

          ARGS="--window-hours=$WINDOW --max-rows=$MAXROWS --no-send --no-whatsapp --no-email"
          if [ "$DRYRUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            if [ "$OUTPUT" = "true" ]; then
              ARGS="$ARGS --output=sheet --allow-final-sheet=$ALLOWFINAL"
            fi
          fi

          npm run patron:no-pc:capture -- $ARGS
