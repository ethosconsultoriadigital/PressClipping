name: Ingesta

# ============================================================================
# INGESTA MANUAL SEGURA (MVP)
# ----------------------------------------------------------------------------
# Workflow de ingesta controlada para la fase MVP. SOLO se ejecuta a mano
# (workflow_dispatch). NO tiene schedule: no corre automáticamente.
#
# Flujo seguro probado localmente:
#   validate:supabase → validate:sheets → crawl (FILTRADO) → detect-mentions
#   → export-results → generate-xml
#
# Reglas de seguridad de esta fase:
#   - El crawl SIEMPRE usa filtros: `--limit=5 --solo-validados` (sin crawl masivo).
#   - NO se ejecuta IA (classify-ia) todavía.
#   - NO se envían alertas (WhatsApp / correo).
#   - sync-sheets queda fuera para no sobrescribir el panel durante pruebas.
# ============================================================================

on:
  # schedule:
  #   - cron: '0 * * * *' # DESACTIVADO hasta aprobación de operación automática
  workflow_dispatch: {} # solo ejecución manual desde la pestaña Actions

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  run:
    name: Ingesta manual segura (MVP)
    runs-on: ubuntu-latest
    env:
      # Secrets REQUERIDOS para la ingesta segura.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      RUN_BY: github-actions-ingesta-manual
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar esquema Supabase (solo lectura)
        run: npm run validate:supabase

      - name: Validar cabeceras de Google Sheets (solo lectura)
        run: npm run validate:sheets

      # Crawl SIEMPRE filtrado: máximo 5 medios, solo los validados (ok/parcial).
      # No usar `npm run crawl` sin filtros en esta fase.
      - name: Ingesta de noticias (FILTRADA, sin crawl masivo)
        run: npm run crawl -- --limit=5 --solo-validados

      - name: Detectar menciones
        run: npm run detect-mentions

      - name: Exportar resultados y logs a Sheets
        run: npm run export-results

      - name: Generar XML
        run: npm run generate-xml

      # ------------------------------------------------------------------------
      # IA DESACTIVADA en esta fase. No habilitar hasta aprobación explícita.
      # `ANTHROPIC_API_KEY` y `XML_SECRET_TOKEN` son OPCIONALES y este workflow
      # no los necesita todavía.
      #
      # - name: Clasificar con IA (DESACTIVADO en MVP)
      #   run: npm run classify-ia
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # ------------------------------------------------------------------------
