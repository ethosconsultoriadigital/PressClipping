# ============================================================================
# LIVE COMPARISON — TIER NACIONAL B (shadow, cada 6 horas, desfasado)
# ----------------------------------------------------------------------------
# WORKFLOW ACTIVO EN MODO SOMBRA (NO producción), SEPARADO del shadow base.
#
# Procesa SOLO el tier nacional limitado (Uno TV MED-0025, Publimetro MED-0053)
# con pipeline AISLADO por medio_id (crawl/enrich/detect) + prefiltro de título
# para Publimetro. Por código (run-shadow-national-tier.ts) impide:
#   export-results · generate-xml · classify-ia · alertas · WhatsApp/correos ·
#   export-raw-news. NO toca 01_Noticias_Raw / 02_Menciones / 04_Logs.
#
# NO incluye Milenio ni Aristegui. NO integra --shadow-alerts.
#
# CONCURRENCY: comparte grupo con el shadow base (`live-comparison-shadow`) para
# que NUNCA dos workflows escriban 05/07 al mismo tiempo. cancel-in-progress=false
# → si el base está corriendo, este se ENCOLA (no se cancela). El cron va a la
# media hora (':30') para desfasarse del base (cada 2h en punto).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY · GOOGLE_SERVICE_ACCOUNT_EMAIL ·
#   GOOGLE_PRIVATE_KEY · GOOGLE_OUTPUT_SHEET_ID (fallback GOOGLE_SHEET_ID)
# ============================================================================
name: live-comparison-shadow-national

on:
  schedule:
    - cron: '30 */6 * * *'   # cada 6 horas, a la media hora (desfasado del base)
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Tamaño de la ventana móvil en horas.'
        required: false
        default: '48'

concurrency:
  group: live-comparison-shadow   # MISMO grupo que el shadow base → lock compartido de 05/07
  cancel-in-progress: false

jobs:
  run:
    name: Shadow national tier B (Uno TV + Publimetro, aislado por medio)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_OUTPUT_SHEET_ID: ${{ secrets.GOOGLE_OUTPUT_SHEET_ID }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      LOG_FORMAT: json
      RUN_BY: github-actions-shadow-national
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # Node 20: OAuth de Google Sheets funciona; Supabase usa el polyfill ws
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Shadow national tier B (ventana móvil 48h, sin alertas, sin export-results)
        # Node 20: inyecta WebSocket global (ws) para Supabase; IPv4 por runners sin IPv6.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
        run: |
          WINDOW="${{ github.event.inputs.window_hours || '48' }}"
          npm run shadow-national-tier -- \
            --tier=B \
            --window-hours=$WINDOW \
            --output=sheet \
            --append-metrics-history \
            --no-alerts \
            --no-export-results \
            --no-generate-xml
