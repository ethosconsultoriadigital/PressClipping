name: news-lake-capture

# Captura general del "news lake" (PressClipping v0): crawl + enrich por
# chunks, SIN cliente ni keyword. Solo workflow_dispatch, SIN schedule
# todavía — se corre manualmente mientras se valida el orquestador.
#
# NO toca Patrón. NO toca Jumex. NO toca NOTAS ENVIADAS MERYPOZOS. NO escribe
# en Google Sheets (no pide esas credenciales). NO email/WhatsApp/Twilio/SMTP.
# NO export-results, NO generate-xml, NO classify-ia. NO detecta menciones.
# NO activa alertas_activas.
#
# `dry_run=true` (default) es el modo seguro: no descarga, no enriquece, no
# escribe nada — solo reporta el plan (medios + chunks) que se ejecutaría.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (no descarga, no enriquece, no escribe)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      max_medios:
        description: 'Tope de medios a incluir (ignorado si se pasa medio_ids)'
        required: false
        default: '20'
        type: string
      medio_ids:
        description: 'Lista opcional de medio_id separados por coma (dirigido; ignora max_medios)'
        required: false
        default: ''
        type: string
      max_notas:
        description: 'Tope de notas a crawlear por medio, por chunk'
        required: false
        default: '5'
        type: string
      enrich_limit:
        description: 'Tope de notas a enriquecer por chunk'
        required: false
        default: '20'
        type: string
      window_days:
        description: 'Ventana en días para enrich (recent-first)'
        required: false
        default: '30'
        type: string
      chunk_size:
        description: 'Medios por chunk (crawl→enrich se ejecuta chunk por chunk)'
        required: false
        default: '5'
        type: string

concurrency:
  group: news-lake-capture
  cancel-in-progress: false

jobs:
  capture:
    name: News Lake Capture (crawl + enrich general, sin clientes/keywords)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOG_FORMAT: json
      RUN_BY: github-actions-news-lake-capture
      # Seguridad: estas variables NUNCA deben configurarse en este workflow.
      NO_SEND: 'true'
      NO_EMAIL: 'true'
      NO_WHATSAPP: 'true'
      NO_TWILIO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: News Lake Capture
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first --import=${{ github.workspace }}/scripts/preload-ws.mjs
        run: |
          ARGS="--dry-run=${{ inputs.dry_run || 'true' }}"
          ARGS="$ARGS --max-medios=${{ inputs.max_medios || '20' }} --max-notas=${{ inputs.max_notas || '5' }} --enrich-limit=${{ inputs.enrich_limit || '20' }} --window-days=${{ inputs.window_days || '30' }} --chunk-size=${{ inputs.chunk_size || '5' }}"
          if [ -n "${{ inputs.medio_ids }}" ]; then
            ARGS="$ARGS --medio-ids=${{ inputs.medio_ids }}"
          fi
          npm run news-lake:capture -- $ARGS
